name: Update AI model pricing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-model-pricing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the generator
        run: node --test scripts/update.test.mjs
      - name: Refresh prices and README files
        run: node scripts/update.mjs
      - name: Validate generated changes
        run: git diff --check
      - name: Commit changed pricing data
        shell: bash
        run: |
          if git diff --quiet -- README.md README.*.md data/models.json; then
            echo "Pricing data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.*.md data/models.json
          git commit -m "Update AI model pricing"
          git push
